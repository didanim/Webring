<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogspot Directory</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    ul { line-height: 1.8; }
  </style>
</head>
<body>
  <h1>Blogspot Directory</h1>
  <p>Widget preview:</p>
  <iframe frameborder='0' style="border:none" src="blogger/widget.html"></iframe>

  <h2>Members</h2>
  <ul id="member-list"></ul>

  <script src="https://didanim.github.io/Webring/blogger/sites.js"></script>
  <script>
    const list = document.getElementById("member-list");
    WEBRING_SITES.forEach(site => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = site.url;
      a.textContent = site.name;
      li.appendChild(a);
      list.appendChild(li);
    });
  </script>
</body>
</html>
