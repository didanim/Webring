<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Webring Widget</title>
  <!-- DO NOT STEAL MY WEBRING GIF (I MADE IT) -->
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
    .widget {
      display: flex;
      align-items: center;
      width: 114px;
      height: 31px;
    }
    .nav-btn {
      width: 13px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      color: #CC5500;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      flex-shrink: 0;
      user-select: none;
    }
    .nav-btn:hover {
      color: #444;
    }
    .center-link {
      width: 88px;
      height: 31px;
      display: block;
      flex-shrink: 0;
      background-color: white;
      background-size: cover;
      background-repeat: no-repeat;
      background-image: url('https://file.garden/ag8JwXEGxlB3Dv6B/myblogger/webring.gif');
    }
  </style>
</head>
<body>
  <script src="https://didanim.github.io/Webring/blogger/sites.js"></script>
  <script type="text/javascript">
    const widget = document.createElement("div");
    widget.className = "widget";

    const leftBtn = document.createElement("a");
    leftBtn.id = "left-btn";
    leftBtn.className = "nav-btn";
    leftBtn.href = "#";
    leftBtn.target = "_blank";
    leftBtn.rel = "noopener nofollow";
    leftBtn.title = "Random site";
    leftBtn.innerHTML = "&#x25C0;";

    const homeBtn = document.createElement("a");
    homeBtn.id = "home-btn";
    homeBtn.className = "center-link";
    homeBtn.href = typeof WEBRING_HOME !== "undefined" ? WEBRING_HOME : "#";
    homeBtn.target = "_blank";
    homeBtn.rel = "noopener nofollow";
    homeBtn.title = "Join the webring";

    const rightBtn = document.createElement("a");
    rightBtn.id = "right-btn";
    rightBtn.className = "nav-btn";
    rightBtn.href = "#";
    rightBtn.target = "_blank";
    rightBtn.rel = "noopener nofollow";
    rightBtn.title = "Random site";
    rightBtn.innerHTML = "&#x25B6;";

    widget.appendChild(leftBtn);
    widget.appendChild(homeBtn);
    widget.appendChild(rightBtn);
    document.body.appendChild(widget);

    function pickRandomSite(excludeUrls) {
      const pool = WEBRING_SITES.filter(site => !excludeUrls.includes(site.url));
      const list = pool.length > 0 ? pool : WEBRING_SITES;
      return list[Math.floor(Math.random() * list.length)];
    }

    function updateNavLinks() {
      if (typeof WEBRING_SITES === "undefined" || !Array.isArray(WEBRING_SITES) || WEBRING_SITES.length === 0) return;

      const referrer = document.referrer || "";
      const currentSite = WEBRING_SITES.find(site =>
        referrer.startsWith(site.url.replace(/\/+$/, ""))
      );
      const exclude = currentSite ? [currentSite.url] : [];

      const leftSite = pickRandomSite(exclude);
      const rightSite = pickRandomSite([...exclude, leftSite.url]);

      leftBtn.href = leftSite.url;
      leftBtn.title = "Visit: " + leftSite.name;

      rightBtn.href = rightSite.url;
      rightBtn.title = "Visit: " + rightSite.name;
    }

    updateNavLinks();
    setInterval(updateNavLinks, 30000);
  </script>
</body>
</html>
