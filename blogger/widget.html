<!DOCTYPE html>
<html lang="en">
<head>
   <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
   <title>Webring for Blogger Users</title>
  <!-- DO NOT STEAL MY WEBRING GIF (I MADE IT) -->   
<style>
  html, body {
    margin: 0;
    padding: 0;
}
  .widget {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    left: 0;
    width: 150px;
    height: 31px;
    overflow: hidden;
  }
  .dd-webring {
      display: flex;
      width: 100%;
      height: 100%;
  }
  .nav-btn {
    width: 13px;
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    color: #CC5500;
    text-decoration: none;
    font-size: 11px;
    font-weight: bold;
    flex-shrink: 0;
    user-select: none;
  }
  .nav-btn:hover {
    color: #444;
  }
  .center-link {
    width: 88px;
    height: 31px;
    display: block;
    flex-shrink: 0;
  }
  .center-link div {
    width: 88px;
    height: 31px;
    display: block;
    object-file: cover;
    border: 0;
  }
</style>
</head>
<body>
<div class="widget">
    <div class="dd-webring">
      <a id="left-btn" class="nav-btn" href="#" target="_blank" rel="noopener nofollow" title="Random site">&#x25C0;</a>
      <a id="home-btn" class="center-link" rel="noopener nofollow" href="#" target="_blank" title="Blogspot Directory">
        <div style="display: block; margin: 0px; background-size: cover; background-repeat: no-repeat; background-color: white; background-image: url('https://file.garden/ag8JwXEGxlB3Dv6B/myblogger/webring.gif');"></div>
      </a>
      <a rel="noopener nofollow" id="right-btn" class="nav-btn" href="#" target="_blank" title="Random site">&#x25B6;</a>
    </div>

    <script type="text/javascript">
const leftBtn = document.getElementById("left-btn");
  const rightBtn = document.getElementById("right-btn");
  const homeBtn = document.getElementById("home-btn");

  let lastLeftNorm = "";
  let lastRightNorm = "";

  function normalizeUrl(url) {
    try {
      const u = new URL(url);
      return (u.hostname.replace(/^www\./, "") + u.pathname.replace(/\/+$/, "")).toLowerCase();
    } catch (e) {
      return (url || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/+$/, "").toLowerCase();
    }
  }

  function getCurrentSite() {
    const sourceUrl =
      document.referrer ||
      (window.location.ancestorOrigins && window.location.ancestorOrigins[0]) ||
      "";
    const normSource = normalizeUrl(sourceUrl);
    if (!normSource) return null;

    return WEBRING_SITES.find(site => {
      const normSite = normalizeUrl(site.url);
      return normSource === normSite || normSource.startsWith(normSite + "/");
    });
  }

  function pickRandomSite(strictExcludes, softExcludes = []) {
    let pool = WEBRING_SITES.filter(site => {
      const norm = normalizeUrl(site.url);
      return !strictExcludes.includes(norm) && !softExcludes.includes(norm);
    });

    if (pool.length === 0) {
      pool = WEBRING_SITES.filter(site => !strictExcludes.includes(normalizeUrl(site.url)));
    }

    if (pool.length === 0) {
      pool = WEBRING_SITES;
    }

    return pool[Math.floor(Math.random() * pool.length)];
  }

  function updateNavLinks() {
    if (!Array.isArray(WEBRING_SITES) || WEBRING_SITES.length === 0) return;

    const currentSite = getCurrentSite();
    const currentNorm = currentSite ? normalizeUrl(currentSite.url) : "";

    const strictExcludes = currentNorm ? [currentNorm] : [];
    const previousShown = [lastLeftNorm, lastRightNorm].filter(Boolean);

    const leftSite = pickRandomSite(strictExcludes, previousShown);
    const leftNorm = normalizeUrl(leftSite.url);

    const rightSite = pickRandomSite([...strictExcludes, leftNorm], previousShown);
    const rightNorm = normalizeUrl(rightSite.url);

    leftBtn.href = leftSite.url;
    leftBtn.title = "Visit: " + leftSite.name;
    lastLeftNorm = leftNorm;

    rightBtn.href = rightSite.url;
    rightBtn.title = "Visit: " + rightSite.name;
    lastRightNorm = rightNorm;
  }

  leftBtn.addEventListener("click", () => setTimeout(updateNavLinks, 100));
  rightBtn.addEventListener("click", () => setTimeout(updateNavLinks, 100));

  const sitesScript = document.createElement("script");
  sitesScript.src = "https://didanim.github.io/Webring/blogger/sites.js?t=" + Date.now();
  sitesScript.onload = function () {
    homeBtn.href = WEBRING_HOME;
    updateNavLinks();
    setInterval(updateNavLinks, 30000);
  };
  document.head.appendChild(sitesScript);
    </script>
  </div>
</body>
</html>
